name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Compact toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          # Installer does not create ~/.local/bin/env — expose the bin dir instead.
          found=0
          for d in "$HOME/.local/bin" "$HOME/.compact/bin"; do
            if [ -x "$d/compact" ]; then
              echo "$d" >> "$GITHUB_PATH"
              export PATH="$d:$PATH"
              found=1
            fi
          done
          [ "$found" = 1 ] || { echo "::error::compact binary not found after install"; exit 1; }
          compact --version
          compact update 0.31.1
          compact compile --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile contract
        run: yarn compile

      - name: Start local stack
        run: docker compose up -d --wait

      - name: Run tests
        run: yarn test:local

      - name: Stop local stack
        if: always()
        run: docker compose down
